<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Profile | Academy Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="profile">
    <div class="app-shell">
      <aside id="sidebar"></aside>
      <section class="content-wrap">
        <header id="topbar"></header>
        <main class="grid cards-2">
          <section class="card">
            <h3>Aarav Sharma</h3>
            <p class="helper">Student ID: STU-1001 | Grade 10-A</p>
            <div class="grid cards-2">
              <article class="card"><div class="metric">Current Score</div><div class="metric-value">93</div></article>
              <article class="card"><div class="metric">Attendance</div><div class="metric-value">97%</div></article>
            </div>
          </section>
          <section class="card">
            <h3>Performance Trend</h3>
            <canvas id="profileChart"></canvas>
          </section>
        </main>
      </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
